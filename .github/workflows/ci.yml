name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build & test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: majestic-af

      # majestic-af uses the public libmotors client API. This branch tracks
      # the matching motorsd prototype until that API lands in OpenIPC/motors.
      - uses: actions/checkout@v4
        with:
          repository: MayorBug/motors
          ref: 916e54a9b06f446ce497aabe0f87513c072716ee
          path: motors

      - name: Configure
        working-directory: majestic-af
        run: cmake -Bbuild -DCMAKE_BUILD_TYPE=Debug

      - name: Build plugin and host tests
        working-directory: majestic-af
        run: cmake --build build

      - name: Run host tests
        working-directory: majestic-af
        run: ctest --test-dir build --output-on-failure
